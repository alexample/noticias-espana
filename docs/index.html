<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DobleCheck · Noticias contrastadas en todos los medios</title>
<meta name="description" content="Las noticias de todos los medios españoles, agrupadas y actualizadas cada 15 minutos.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DobleCheck">
<meta property="og:title" content="DobleCheck · Noticias contrastadas en todos los medios">
<meta property="og:description" content="Las noticias de todos los medios españoles, agrupadas y actualizadas cada 15 minutos.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="og.png">
<style>
  :root {
    --bg: #f7f5f0; --paper: #fff; --ink: #161514; --muted: #6b6760; --line: #e3dfd6;
    --accent: #b3261e; --chip: #efebe3; --new: #1f6f43; --check: #1d9bd8;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --paper: #1c1b19; --ink: #ece8e1; --muted: #a09a90; --line: #2e2c29;
            --accent: #ff6b5e; --chip: #2a2825; --new: #5fc28a; --check: #53bdeb; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.45; }
  a { color: inherit; }
  header { border-bottom: 3px double var(--line); background: var(--paper); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 18px 0 10px; flex-wrap: wrap; }
  .logo { font-family: var(--serif); font-size: 34px; font-weight: 400; letter-spacing: -0.5px; text-decoration: none; white-space: nowrap; }
  .logo b { font-weight: 700; }
  .logo .ticks { width: 34px; height: 23px; color: var(--check); margin-left: 6px; vertical-align: -1px; }
  .badge .ticks { width: 15px; height: 10px; margin-right: 4px; vertical-align: 0; }
  .meta { font-size: 13px; color: var(--muted); }
  .bar { display: flex; gap: 10px; padding: 10px 0 14px; flex-wrap: wrap; align-items: center; }
  .bar input[type=search] { flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
                            background: var(--bg); color: var(--ink); font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--paper); }
  main { padding: 24px 0 60px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 22px; }
  .card { grid-column: span 4; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; text-decoration: none; transition: transform .12s ease, box-shadow .12s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,.07); }
  .card.lead { grid-column: span 8; grid-row: span 2; }
  .card.lead:not(:has(img)) { grid-row: auto; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--chip); display: block; }
  .card .in { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h2 { font-family: var(--serif); font-size: 21px; line-height: 1.2; margin: 0; }
  .card.lead h2 { font-size: 32px; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .card.lead p { font-size: 16px; }
  .foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .badge { background: var(--check); color: #fff; border-radius: 999px; padding: 2px 9px; font-weight: 600; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 8px; }
  .hot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0 18px 10px; margin: -6px 0 0 -10px; }
  .hot-label { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent);
               display: inline-flex; align-items: center; gap: 6px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(179,38,30,.55); } 100% { box-shadow: 0 0 0 9px rgba(179,38,30,0); } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  .tag { flex: 0 1 auto; max-width: 100%; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
         background: var(--paper); border: 1px solid var(--line); text-decoration: none; font-size: 14px; font-weight: 600;
         white-space: nowrap; transition: border-color .12s ease; }
  .tag:hover { border-color: var(--accent); }
  .tag b { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 7px; }
  .intl-country { font-size: 15px; font-weight: 700; margin: 18px 0 2px; display: flex; align-items: center; gap: 8px; }
  .intl-country .flag { font-size: 20px; }
  .intl-note { font-size: 12.5px; color: var(--muted); margin: -4px 0 6px; }
  .chip.world { background: transparent; border: 1px solid var(--line); }
  details.evo { margin: 14px 0 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
  details.evo > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px;
                          font-size: 14px; font-weight: 700; user-select: none; }
  details.evo > summary::-webkit-details-marker { display: none; }
  details.evo > summary .count { font-weight: 600; font-size: 12px; color: var(--muted); }
  details.evo > summary .chev { margin-left: auto; transition: transform .15s ease; color: var(--muted); }
  details.evo[open] > summary .chev { transform: rotate(180deg); }
  details.evo[open] > summary { border-bottom: 1px solid var(--line); }
  .evo ol { list-style: none; margin: 0; padding: 14px 16px 6px 16px; }
  .evo li { position: relative; padding: 0 0 16px 22px; }
  .evo li::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: -6px; width: 2px; background: var(--line); }
  .evo li:last-child::before { display: none; }
  .evo li::after { content: ""; position: absolute; left: 0; top: 4px; width: 10px; height: 10px; border-radius: 50%;
                   background: var(--paper); border: 2px solid var(--muted); box-sizing: border-box; }
  .evo li.ai::after { border-color: var(--accent); background: var(--accent); }
  .evo li.first::after { border-color: var(--ink); background: var(--ink); }
  .evo .when { font-size: 12px; color: var(--muted); }
  .evo .what { font-size: 14.5px; margin-top: 1px; }
  .evo .quote { font-family: var(--serif); font-size: 15.5px; color: var(--muted); margin-top: 2px; }
  .evo .ia { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--accent); border: 1px solid var(--accent);
             border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
  .badge.single { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .bk { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
        text-transform: uppercase; color: var(--accent); }
  .follow { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 6px; padding: 9px 16px; border-radius: 999px;
            border: 1px solid var(--check); background: transparent; color: var(--check); font-size: 15px; font-weight: 700;
            cursor: pointer; font-family: var(--sans); }
  .follow.on { background: var(--check); color: #fff; }
  .app-link { font-size: 13px; color: var(--check); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .readers { margin: 22px 0 8px; padding: 16px 18px; border-radius: 12px; background: var(--chip); }
  .readers h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .readers p { margin: 0 0 10px; font-family: var(--serif); font-size: 17.5px; line-height: 1.5; }
  .readers .rm { font-size: 12.5px; color: var(--muted); }
  .readers .rm a { color: var(--check); text-decoration: none; }
  .empty { text-align: center; color: var(--muted); padding: 80px 20px; }
  .detail { max-width: 760px; margin: 0 auto; }
  .detail .bk { display: flex; margin: 0 0 8px 4px; }
  .back { display: inline-block; margin-bottom: 18px; color: var(--muted); text-decoration: none; font-size: 14px; cursor: pointer; }
  .detail h1 { font-family: var(--serif); font-size: 40px; line-height: 1.12; margin: 0 0 12px; letter-spacing: -0.3px; }
  .detail .lead { font-family: var(--serif); font-size: 21px; color: var(--muted); margin: 0 0 18px; }
  .detail .hero { width: 100%; border-radius: 10px; margin: 6px 0 20px; aspect-ratio: 16/9; object-fit: cover; }
  .detail .body p { font-family: var(--serif); font-size: 18.5px; line-height: 1.6; margin: 0 0 16px; }
  .note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 12px; margin: 18px 0; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 36px 0 10px;
       border-top: 1px solid var(--line); padding-top: 18px; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .timeline time { font-size: 12px; color: var(--muted); padding-top: 3px; }
  .timeline .src { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .timeline a { font-family: var(--serif); font-size: 17px; text-decoration: none; display: block; margin: 2px 0; }
  .timeline a:hover { text-decoration: underline; }
  .timeline .sum { font-size: 13.5px; color: var(--muted); }
  .new { color: var(--new); font-size: 11px; font-weight: 700; margin-left: 6px; }
  @media (max-width: 900px) { .card, .card.lead { grid-column: span 6; } .card.lead { grid-column: span 12; } }
  @media (max-width: 620px) { .card, .card.lead { grid-column: span 12; } .card.lead h2 { font-size: 25px; }
    .detail h1 { font-size: 30px; } .timeline li { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="masthead">
      <a class="logo" href="#/" aria-label="DobleCheck">Doble<b>Check</b><svg class="ticks" viewBox="0 0 18 12" aria-hidden="true"><path d="M1.5 6.5l3.2 3.2L11 2.5M7.6 9.2l.5.5L16.5 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <div class="meta"><span id="meta">Cargando…</span>
        <a class="app-link" id="applink" href="https://github.com/alexample/noticias-espana/releases/latest/download/DobleCheck.apk"> · 📱 App Android</a></div>
    </div>
    <div class="bar" id="bar">
      <input type="search" id="q" placeholder="Buscar en las noticias…" autocomplete="off">
      <div class="seg" id="minsrc">
        <button data-v="1">Todas</button><button data-v="2" class="on">2+ medios</button>
        <button data-v="4">4+ medios</button><button data-v="8">Grandes</button>
      </div>
      <div class="seg" id="hours">
        <button data-v="6">6 h</button><button data-v="24">24 h</button><button data-v="48" class="on">48 h</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
// La web lee un único archivo estático (data/stories.json) que genera el worker.
// Funciona igual en GitHub Pages que con server.py.
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TICKS = '<svg class="ticks" viewBox="0 0 18 12" aria-hidden="true"><path d="M1.5 6.5l3.2 3.2L11 2.5M7.6 9.2l.5.5L16.5 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TICK1 = '<svg class="ticks" viewBox="0 0 18 12" aria-hidden="true"><path d="M3.5 6.5l3.2 3.2L13 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// ✓ un medio (sin confirmar) · ✓✓ confirmada por varios medios, como en WhatsApp
const badge = (n, extra = "") => n > 1
  ? `<span class="badge">${TICKS}${n} medios${extra}</span>`
  : `<span class="badge single" title="Pendiente de confirmar por otros medios">${TICK1}1 medio · sin confirmar</span>`;
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const fold = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const state = { min: 2, hours: 48, q: "" };
let DATA = { stories: [], merged: {}, generated_at: 0 }, STATUS = null;

function ago(ts) {
  if (!ts) return "";
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "ahora";
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60);
  return h < 24 ? `hace ${h} h` : `hace ${Math.round(h / 24)} d`;
}
const hhmm = ts => new Date(ts * 1000).toLocaleString("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });

async function load() {
  try {
    const [d, st] = await Promise.all([
      fetch(`data/stories.json?t=${Date.now()}`).then(r => r.json()),
      fetch(`data/status.json?t=${Date.now()}`).then(r => r.json()).catch(() => null),
    ]);
    DATA = d; STATUS = st;
  } catch (e) { DATA = { stories: [], merged: {}, error: true }; }
  const ok = STATUS ? STATUS.sources.filter(s => s.last_status && !s.last_status.startsWith("error")).length : 0;
  $("#meta").textContent = STATUS
    ? `${STATUS.multi} noticias con varios medios · ${ok}/${STATUS.sources.length} medios activos · actualizado ${ago(DATA.generated_at)}`
    : "";
  render();
}

function card(s, i) {
  const img = safeUrl(s.image);
  const shown = s.sources.slice(0, i === 0 ? 6 : 3);
  const more = s.sources.length - shown.length;
  return `<a class="card ${i === 0 ? "lead" : ""}" href="#/noticia/${s.id}">
    ${img ? `<img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
    <div class="in">
      ${s.breaking ? `<span class="bk"><span class="pulse"></span>Última hora</span>` : ""}
      <h2>${esc(s.headline)}</h2>
      ${s.lead ? `<p>${esc(s.lead)}</p>` : ""}
      <div class="foot">
        ${badge(s.n_sources)}
        ${shown.map(x => `<span class="chip">${esc(x)}</span>`).join("")}
        ${more > 0 ? `<span>+${more}</span>` : ""}
        ${(s.intl || []).length ? `<span class="chip world" title="Cobertura internacional">${s.intl.map(c => c.flag).join(" ")}</span>` : ""}
        ${s.readers ? `<span class="chip world" title="Incluye lo que opinan los lectores">💬 Lectores</span>` : ""}
        <span>· ${ago(s.last_published)}</span>
      </div>
    </div></a>`;
}

// Noticias "en desarrollo": las que más artículos nuevos han recibido en las últimas 2 horas.
function hotStories() {
  return DATA.stories
    .filter(s => (s.n_sources >= 2 && (s.recent_articles || 0) >= 2) || (s.breaking && (s.recent_articles || 0) >= 1))
    .sort((a, b) => (b.recent_sources - a.recent_sources) || (b.recent_articles - a.recent_articles) || (b.relevance - a.relevance))
    .slice(0, 10);
}
function hotStrip() {
  const hot = hotStories();
  if (!hot.length) return "";
  const label = s => s.tag || (s.headline.split(/\s+/).slice(0, 5).join(" ") + (s.headline.split(/\s+/).length > 5 ? "…" : ""));
  return `<nav class="hot" aria-label="Noticias en desarrollo">
    <span class="hot-label"><span class="pulse"></span>En desarrollo</span>
    ${hot.map(s => `<a class="tag" href="#/noticia/${s.id}" title="${esc(s.headline)}">${esc(label(s))}<b>+${s.recent_articles}</b></a>`).join("")}
  </nav>`;
}

function renderList() {
  $("#bar").style.display = "";
  document.title = "DobleCheck · Noticias contrastadas en todos los medios";
  const since = Date.now() / 1000 - state.hours * 3600, q = fold(state.q.trim());
  // última hora: aparece aunque la tenga un solo medio
  const pinned = s => s.breaking && s.last_published >= Date.now() / 1000 - 2 * 3600;
  const list = DATA.stories.filter(s => (s.n_sources >= state.min || (s.breaking && state.min <= 2)) && s.last_published >= since &&
    (!q || fold(s.headline + " " + s.lead + " " + s.articles.map(a => a.title).join(" ")).includes(q)));
  // orden: 1) última hora de las 2 últimas horas (la más reciente arriba), 2) las de «En desarrollo»
  // en el mismo orden que sus etiquetas, 3) el resto por relevancia
  const hotRank = new Map(hotStories().map((s, i) => [s.id, i]));
  const group = s => pinned(s) ? 0 : hotRank.has(s.id) ? 1 : 2;
  list.sort((a, b) => (group(a) - group(b))
    || (group(a) === 0 ? b.last_published - a.last_published : 0)
    || (group(a) === 1 ? hotRank.get(a.id) - hotRank.get(b.id) : 0));
  $("#app").innerHTML = DATA.error
    ? `<div class="empty">Aún no hay datos. El robot los publicará en su próxima pasada.</div>`
    : list.length
      ? `${q ? "" : hotStrip()}<div class="grid">${list.slice(0, 60).map(card).join("")}</div>`
      : `<div class="empty">No hay noticias con estos filtros.</div>`;
}

// Cómo cuenta la noticia la prensa del país del que trata (titulares en su idioma original).
function intlSection(s) {
  if (!(s.intl || []).length) return "";
  return `<h3>Cobertura internacional</h3>
    <p class="intl-note">Titulares de la prensa del país implicado, en su idioma original.</p>
    ${s.intl.map(c => `<div class="intl-country"><span class="flag">${c.flag}</span>${esc(c.name)}</div>
      <ul class="timeline">${c.articles.map(a => `<li>
        <time>${hhmm(a.published_at)}</time>
        <div><span class="src">${esc(a.source)}</span>
          <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></div></li>`).join("")}</ul>`).join("")}`;
}

// Pestaña desplegable con cómo ha ido evolucionando la noticia (la más reciente arriba).
function evolution(s) {
  const ev = s.timeline || [];
  if (ev.length < 2) return "";
  const list = names => names.length <= 3 ? names.join(", ") : `${names.slice(0, 3).join(", ")} y ${names.length - 3} más`;
  const item = e => {
    let cls = e.kind, what = "", quote = "";
    if (e.kind === "media") {
      if (e.first) {
        cls += " first";
        const others = e.sources.filter(x => x !== e.source);
        what = `<b>Primera publicación</b> · ${esc(e.source)}${others.length ? ` y en la primera media hora ${esc(list(others))}` : ""}`;
      }
      else if (e.sources.length) what = `<b>+${e.sources.length} ${e.sources.length === 1 ? "medio" : "medios"}</b>: ${esc(list(e.sources))}`;
      else what = `<b>Nueva información</b> de ${esc(list(e.follow))}`;
      quote = `«${esc(e.title)}»`;
    } else if (e.kind === "ai") {
      what = e.first ? `<b>Primera versión redactada</b> con ${e.n_sources} medios<span class="ia">IA</span>`
                     : `<b>Actualización</b><span class="ia">IA</span>`;
      quote = e.first ? "" : esc(e.note);
    } else if (e.kind === "intl") {
      what = `${e.flag} <b>La prensa de ${esc(e.name)}</b> se hace eco · ${e.count} ${e.count === 1 ? "medio" : "medios"}`;
    }
    return `<li class="${cls}"><div class="when">${hhmm(e.at)}</div><div class="what">${what}</div>${quote ? `<div class="quote">${quote}</div>` : ""}</li>`;
  };
  return `<details class="evo">
    <summary>Evolución de la noticia <span class="count">· ${ev.length} momentos · última ${ago(ev[0].at)}</span><span class="chev">▾</span></summary>
    <ol>${ev.map(item).join("")}</ol>
  </details>`;
}

// Dentro de la app de Android: botón para seguir la noticia y recibir sus novedades.
const APP = /DobleCheckApp/.test(navigator.userAgent) && window.DobleCheckApp;
function followButton(s) {
  if (!APP) return "";
  const on = window.DobleCheckApp.isFollowing(s.id);
  return `<button class="follow ${on ? "on" : ""}" data-id="${s.id}" data-h="${esc(s.headline)}">${on ? "🔔 Siguiendo · te avisaremos de cada novedad" : "🔔 Seguir esta noticia"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button.follow");
  if (!b || !APP) return;
  const on = window.DobleCheckApp.toggleFollow(+b.dataset.id, b.dataset.h);
  b.classList.toggle("on", on);
  b.textContent = on ? "🔔 Siguiendo · te avisaremos de cada novedad" : "🔔 Seguir esta noticia";
});
if (APP) { const l = document.getElementById("applink"); if (l) l.remove(); }

// «Qué dicen los lectores»: resumen (IA) de los comentarios en YouTube del vídeo de la noticia.
function readersSection(s) {
  const r = s.readers;
  if (!r || !r.summary) return "";
  const vids = (r.videos || []).map(v => `<a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener noreferrer">vídeo de ${esc(v.channel)}</a>`).join(" y ");
  return `<section class="readers">
    <h4>💬 Qué dicen los lectores</h4>
    <p>${esc(r.summary)}</p>
    <div class="rm">Resumen automático (IA) de ${r.count} comentarios en YouTube${vids ? ` · ${vids}` : ""} · ${ago(r.at)}. No refleja la opinión de DobleCheck.</div>
  </section>`;
}

function renderStory(id) {
  const wasOpen = !!document.querySelector("details.evo[open]");
  $("#bar").style.display = "none";
  if (DATA.merged[id]) { location.replace(`#/noticia/${DATA.merged[id]}`); return; }
  const s = DATA.stories.find(x => String(x.id) === String(id));
  if (!s) { $("#app").innerHTML = `<div class="empty">Noticia no encontrada o ya archivada. <a href="#/">Volver a la portada</a></div>`; return; }
  document.title = `${s.headline} · DobleCheck`;
  const img = safeUrl(s.image);
  const body = (s.body || "").split(/\n{2,}/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  const pending = s.articles.filter(a => a.new_since_ai).length;
  $("#app").innerHTML = `<article class="detail">
    <a class="back" href="#/">← Portada</a>
    <div>${s.breaking ? `<span class="bk"><span class="pulse"></span>Última hora</span>` : ""}</div>
    <h1>${esc(s.headline)}</h1>
    ${s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}
    <div class="foot" style="margin-bottom:8px">
      ${badge(s.n_sources)}<span>${s.n_articles} ${s.n_articles === 1 ? "artículo" : "artículos"}</span>
      <span>· primera publicación ${hhmm(s.first_published)}</span><span>· última ${ago(s.last_published)}</span>
    </div>
    ${followButton(s)}
    ${evolution(s)}
    ${img ? `<img class="hero" src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
    <div class="body">${body}</div>
    ${readersSection(s)}
    <div class="note">${s.ai_written
      ? `Texto redactado automáticamente con IA a partir de ${s.ai_sources_count} medios · ${ago(s.ai_written_at)}.${pending ? ` Hay ${pending} artículo(s) nuevo(s) desde entonces; el texto se actualizará en breve.` : ""}`
      : s.n_sources === 1
        ? `Noticia de última hora publicada por un solo medio (${esc(s.sources[0])}), pendiente de confirmar. Cuando otros medios la confirmen se redactará y pasará a ✓✓.`
        : `Mostrando el titular original del medio más representativo. El texto se redactará en breve.`}</div>
    <h3>Cobertura por medio</h3>
    <ul class="timeline">${s.articles.map(a => `<li>
      <time>${hhmm(a.published_at)}</time>
      <div><span class="src">${esc(a.source)}</span>${a.new_since_ai ? `<span class="new">NUEVO</span>` : ""}
        <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a>
        ${a.summary ? `<div class="sum">${esc(a.summary.slice(0, 220))}${a.summary.length > 220 ? "…" : ""}</div>` : ""}
      </div></li>`).join("")}</ul>
    ${intlSection(s)}
  </article>`;
  if (wasOpen) { const d = document.querySelector("details.evo"); if (d) d.open = true; }
}

function render() {
  const m = location.hash.match(/^#\/noticia\/(\d+)/);
  m ? renderStory(m[1]) : renderList();
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
for (const [id, key] of [["minsrc", "min"], ["hours", "hours"]]) {
  $("#" + id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    $("#" + id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    state[key] = +b.dataset.v; renderList();
  });
}
let deb; $("#q").addEventListener("input", e => { clearTimeout(deb); deb = setTimeout(() => { state.q = e.target.value; renderList(); }, 200); });
// compatibilidad con enlaces antiguos /noticia/123
const old = location.pathname.match(/\/noticia\/(\d+)/); if (old) location.replace(`./#/noticia/${old[1]}`);
load();
setInterval(load, 120000);
</script>
</body>
</html>
