name: Actualizar noticias

# Lee los medios, agrupa las noticias, redacta con IA las que lo necesiten y
# publica la web en GitHub Pages.
# Cada 15 minutos lo lanza el Worker de Cloudflare (cloudflare/worker.js), que es puntual.
# El horario de GitHub es solo un respaldo cada hora por si el Worker fallara
# (GitHub a veces retrasa o se salta sus horarios).
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:          # lo usa el Worker de Cloudflare y el botón "Run workflow"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.py"
      - "feeds.json"
      - ".github/workflows/publicar.yml"

permissions:
  contents: write   # solo para el "latido" semanal (ver último paso)
  pages: write
  id-token: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # La base de datos (qué artículos ya se han visto y a qué noticia pertenecen)
      # se guarda en la caché de Actions entre ejecuciones. Si se pierde, se
      # reconstruye sola con lo publicado en las últimas 48 h.
      - name: Recuperar base de datos
        uses: actions/cache/restore@v4
        with:
          path: data/noticias.db
          key: noticias-db-${{ github.run_id }}
          restore-keys: noticias-db-

      - name: Ejecutar el worker (un ciclo)
        env:
          # Secreto opcional: sin él la web muestra el titular original de cada medio.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Comentarios de YouTube para «Qué dicen los lectores» (opcional)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          export NEWS_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python worker.py --once --no-telegram

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # A veces GitHub Pages falla de forma pasajera ("Fetching artifact metadata failed").
      # Se reintenta dos veces antes de darlo por perdido; si aun así falla, la pasada
      # siguiente vuelve a publicar todo, así que no se marca la ejecución como fallida.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes de reintentar
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Esperar antes del último intento
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - id: published
        name: Comprobar publicación
        run: |
          if [ "${{ steps.deploy.outcome }}" = success ] || [ "${{ steps.deploy2.outcome }}" = success ] || [ "${{ steps.deploy3.outcome }}" = success ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages no respondió tras 3 intentos; la web se actualizará en la próxima pasada."
          fi

      # Telegram se publica justo después de desplegar: así la página de cada noticia
      # (con su miniatura) ya está en la web cuando Telegram la consulta, sin retraso.
      - name: Publicar en Telegram
        if: steps.published.outputs.ok == 'true'   # solo si la web (y las miniaturas) están en línea
        env:
          # Canal de Telegram (opcional): sin estos secretos no se publica nada
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export NEWS_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          sleep 15   # margen para que la CDN de GitHub Pages sirva lo recién desplegado
          python worker.py --telegram

      - name: Compactar base de datos
        if: always() && hashFiles('data/noticias.db') != ''
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/noticias.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.execute('PRAGMA journal_mode=DELETE'); c.execute('VACUUM'); c.close()"
          ls -la data/

      - name: Guardar base de datos
        if: always() && hashFiles('data/noticias.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/noticias.db
          key: noticias-db-${{ github.run_id }}


      # GitHub desactiva las tareas programadas de un repositorio tras 60 días sin
      # commits. Una vez por semana se guarda un archivo diminuto para evitarlo.
      - name: Latido semanal
        run: |
          semana=$(date -u +%G-W%V)
          if [ "$(cat estado/latido.txt 2>/dev/null)" != "$semana" ]; then
            mkdir -p estado && echo "$semana" > estado/latido.txt
            git config user.name "noticias-bot"
            git config user.email "noticias-bot@users.noreply.github.com"
            git add estado/latido.txt
            git commit -m "Latido $semana"
            git pull --rebase origin main && git push || echo "No se pudo guardar el latido (se reintentará)"
          fi
